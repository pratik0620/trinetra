name: women_safety_app
description: "RAKSHA — Women's Safety Ecosystem. Protection that never walks alone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Typography
  google_fonts: ^6.2.1

  # Charts & Graphs
  fl_chart: ^0.69.0

  # Spacing utility
  gap: ^3.0.1

  # Progress indicators
  percent_indicator: ^4.2.3

  # Date formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

name: women_safety_app
description: "RAKSHA — Women's Safety Ecosystem. Protection that never walks alone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # BLE & Permissions
  flutter_blue_plus: ^1.31.14
  permission_handler: ^11.3.1
  nearby_connections: ^4.3.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Typography
  google_fonts: ^6.2.1

  # Charts & Graphs
  fl_chart: ^0.69.0

  # Spacing utility
  gap: ^3.0.1

  # Progress indicators
  percent_indicator: ^4.2.3

  # Date formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.1.0
  firebase_messaging: ^16.1.0

  # Local persistence
  shared_preferences: ^2.5.2

  # Local Notifications
  flutter_local_notifications: ^17.2.1

  # URL Launcher for calls and maps
  url_launcher: ^6.3.0

  # Google Maps & Geolocation
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
